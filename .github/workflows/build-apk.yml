name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build apk --debug

      - name: Publish APK as a release
        run: |
          gh release create "build-${{ github.run_number }}" \
            build/app/outputs/flutter-apk/app-debug.apk \
            --title "gait_app debug build ${{ github.run_number }}" \
            --notes "Automated debug APK from commit ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
